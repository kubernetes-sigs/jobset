suite: Test controller configmap

templates:
  - controller/configmap.yaml

release:
  name: jobset
  namespace: jobset-system

tests:
  - it: Should not render featureGates if `controller.featureGates` is empty
    asserts:
      - notMatchRegex:
          path: data["controller_manager_config.yaml"]
          pattern: featureGates

  - it: Should render featureGates if `controller.featureGates` is set
    set:
      controller:
        featureGates:
          TLSOptions: true
          InPlaceRestart: false
    asserts:
      - matchRegex:
          path: data["controller_manager_config.yaml"]
          pattern: |-
            featureGates:
              InPlaceRestart: false
              TLSOptions: true
