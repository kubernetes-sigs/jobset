suite: Test Prometheus ServiceMonitor

templates:
  - prometheus/monitor.yaml

release:
  name: jobset
  namespace: jobset-system

tests:
  - it: Should not create Prometheus ServiceMonitor by default
    asserts:
      - hasDocuments:
          count: 0

  - it: Should create Prometheus ServiceMonitor if `prometheus.enable` is `true`
    capabilities:
      apiVersions:
        - monitoring.coreos.com/v1/ServiceMonitor
    set:
      prometheus:
        enable: true
    asserts:
      - containsDocument:
          apiVersion: monitoring.coreos.com/v1
          kind: ServiceMonitor
          name: jobset-metrics-service-monitor

  - it: Should fail if the cluster does not support the required API resource `monitoring.coreos.com/v1/ServiceMonitor`
    set:
      prometheus:
        enable: true
    asserts:
      - failedTemplate:
          errorMessage: "The cluster does not support the required API resource `monitoring.coreos.com/v1/ServiceMonitor`."

  - it: Should use the metrics server certificate as the client certificate by default
    release:
      name: my-jobset
    capabilities:
      apiVersions:
        - monitoring.coreos.com/v1/ServiceMonitor
    set:
      prometheus:
        enable: true
      certManager:
        enable: true
    asserts:
      - equal:
          path: spec.endpoints[0].tlsConfig.ca.secret.name
          value: my-jobset-metrics-server-cert
      - equal:
          path: spec.endpoints[0].tlsConfig.cert.secret.name
          value: my-jobset-metrics-server-cert
      - equal:
          path: spec.endpoints[0].tlsConfig.keySecret.name
          value: my-jobset-metrics-server-cert

  - it: Should use `prometheus.prometheusClientCertSecretName` as the client certificate if set
    capabilities:
      apiVersions:
        - monitoring.coreos.com/v1/ServiceMonitor
    set:
      prometheus:
        enable: true
        prometheusClientCertSecretName: prometheus-client-cert
      certManager:
        enable: true
    asserts:
      - equal:
          path: spec.endpoints[0].tlsConfig.cert.secret.name
          value: prometheus-client-cert
      - equal:
          path: spec.endpoints[0].tlsConfig.keySecret.name
          value: prometheus-client-cert
