# KEP-969 Representative API: "Schedule groups independently"
#
# scheduling:
#   replicatedJobs:
#     - targetReplicatedJobs: [launcher]
#       schedulingPolicy: {gang: {}}
#     - targetReplicatedJobs: [worker]
#       schedulingPolicy: {gang: {}}
#
# Expected: one Workload containing one PodGroup per targeted ReplicatedJob,
# named "<jobset-name>-<replicatedjob-name>": one for launcher, one for worker.
# Each PodGroup's minCount is independently computed from its own
# ReplicatedJob's parallelism x replicas (launcher: 1, worker: 4).
#
# Verify:
#   kubectl get workloads,podgroups,jobs -n default
#   kubectl get podgroups -n default -o custom-columns=NAME:.metadata.name,MINCOUNT:.spec.schedulingPolicy.gang.minCount
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: per-rj-independent
  namespace: default
spec:
  successPolicy:
    operator: All
  network:
    enableDNSHostnames: true
  scheduling:
    replicatedJobs:
      - targetReplicatedJobs: ["launcher"]
        schedulingPolicy:
          gang: {}
      - targetReplicatedJobs: ["worker"]
        schedulingPolicy:
          gang: {}
  replicatedJobs:
    - name: launcher
      replicas: 1
      template:
        spec:
          parallelism: 1
          completions: 1
          completionMode: Indexed
          template:
            spec:
              restartPolicy: OnFailure
              containers:
                - name: launcher
                  image: gcr.io/k8s-staging-perf-tests/sleep:v0.1.0
                  command: ["sleep", "30s"]
                  resources:
                    requests:
                      cpu: 100m
                      memory: 64Mi
    - name: worker
      replicas: 2
      template:
        spec:
          parallelism: 2
          completions: 2
          completionMode: Indexed
          template:
            spec:
              restartPolicy: OnFailure
              containers:
                - name: worker
                  image: gcr.io/k8s-staging-perf-tests/sleep:v0.1.0
                  command: ["sleep", "30s"]
                  resources:
                    requests:
                      cpu: 100m
                      memory: 64Mi
