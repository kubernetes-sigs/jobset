# Elastic Gang Scheduling Example
#
# Mirrors the integration test "should patch Gang minCount in place when
# ElasticJobSet changes parallelism" (test/integration/scheduling/scheduling_test.go)
# and the KEP-969 "Scale an elastic workload" representative API.
#
# A single ReplicatedJob is gang-scheduled with parallelism/completions=2.
#
# Expected results (before scaling):
#   - A Workload named "gang-elastic" with 1 PodGroupTemplate
#   - A single PodGroup "gang-elastic" with Gang policy, minCount=2
#
# The upstream GangSchedulingPolicy.MinCount field is +required, so the
# JobSet CRD's embedded schedulingPolicy.gang.minCount is also required.
# JobSet's mutating webhook (jobset-controller-manager) fills it in at CREATE
# time with the computed pod count so users can write `gang: {}` without
# specifying minCount themselves, and records that the value was auto-derived
# (rather than chosen by the user) via an internal annotation
# (constants.GangMinCountAutoDefaultedKey and friends). spec.scheduling as a
# whole is immutable (enforced by a CEL rule) and the mutating webhook only
# runs on CREATE, not UPDATE, so the value stored in spec.scheduling itself
# never changes after creation. But the controller's minCount computation
# (totalMinCount in pkg/controllers/scheduling.go) checks that annotation on
# every reconcile: when it's present, the stored value is treated as derived
# rather than user-chosen, and minCount is recomputed from the live
# ReplicatedJobs' parallelism/completions and patched onto the Workload/
# PodGroup in place — verified below against a real WAS Kind cluster with the
# mutating webhook enabled.
#
# Because spec.scheduling is immutable, scale it by patching only
# spec.replicatedJobs (see elastic-gang-scale-patch.yaml) rather than
# re-applying the whole JobSet with a modified spec.scheduling block.
#
# Verify:
#   kubectl get workloads,podgroups,jobs -n default
#   kubectl get podgroup gang-elastic -n default -o jsonpath='{.spec.schedulingPolicy.gang.minCount}{"\n"}'
#   kubectl get workload gang-elastic -n default -o jsonpath='{.metadata.uid}{"\n"}'
#
# To reproduce the scale-up and observe minCount update from 2 to 4 in place:
#   kubectl patch jobset gang-elastic -n default --type=json -p \
#     '[{"op":"replace","path":"/spec/replicatedJobs/0/template/spec/parallelism","value":4},
#       {"op":"replace","path":"/spec/replicatedJobs/0/template/spec/completions","value":4}]'
# (see elastic-gang-scale-patch.yaml for why a plain `kubectl apply` or
# `--type=merge` patch don't work for this.)

apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: gang-elastic
  namespace: default
spec:
  successPolicy:
    operator: All
  network:
    enableDNSHostnames: true
  scheduling:
    schedulingPolicy:
      gang: {}
    disruptionMode:
      all: {}
  replicatedJobs:
    - name: workers
      replicas: 1
      template:
        spec:
          parallelism: 2
          completions: 2
          completionMode: Indexed
          template:
            spec:
              restartPolicy: OnFailure
              containers:
                - name: worker
                  image: gcr.io/k8s-staging-perf-tests/sleep:v0.1.0
                  command: ["sleep", "120s"]
                  resources:
                    requests:
                      cpu: 100m
                      memory: 64Mi
