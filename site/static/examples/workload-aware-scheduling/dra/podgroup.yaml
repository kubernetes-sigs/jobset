apiVersion: scheduling.k8s.io/v1alpha3
kind: PodGroup
metadata:
  name: training-workers
  namespace: default
spec:
  workloadRef:
    workloadName: training-workload
    templateName: workers
  schedulingPolicy:
    gang:
      minCount: 6
  resourceClaims:
  - name: shared-gpu
    resourceClaimTemplateName: gpu-claim-template
