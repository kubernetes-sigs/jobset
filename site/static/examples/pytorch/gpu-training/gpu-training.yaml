# Distributed training of a ResNet-18 model on the CIFAR-10 dataset using
# PyTorch and GPUs. This example runs 2 worker pods, each requesting 2 GPUs,
# for a total of 4 GPUs participating in the training job. Nodes must expose
# nvidia.com/gpu resources (see the README for the NVIDIA device plugin).
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: pytorch-gpu
spec:
  # Enable DNS hostnames so each pod is reachable by a stable hostname
  # (e.g. pytorch-gpu-workers-0-0.pytorch-gpu). PyTorch uses these hostnames to
  # discover the other workers when setting up distributed training.
  network:
    enableDNSHostnames: true
  replicatedJobs:
  - name: workers
    template:
      spec:
        # Two child Jobs, each running one training replica with 2 GPUs.
        parallelism: 2
        completions: 2
        backoffLimit: 0
        template:
          spec:
            containers:
            - name: pytorch-gpu
              image: <REGISTRY>/<USERNAME>/pytorch-gpu-training:latest
              ports:
              - containerPort: 3389
              env:
              - name: MASTER_ADDR
                value: "pytorch-gpu-workers-0-0.pytorch-gpu"
              - name: MASTER_PORT
                value: "3389"
              # The job-completion-index is 0 for the first worker, 1 for the
              # second, ... and is used as the node rank in the training ring.
              - name: RANK
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
              # Force python to not buffer output and write directly to stdout, so we can view training logs via `kubectl logs`.
              - name: PYTHONUNBUFFERED
                value: "0"
              resources:
                requests:
                  nvidia.com/gpu: "2"
                limits:
                  nvidia.com/gpu: "2"
              command:
              - bash
              - -xc
              - |
                torchrun --nproc_per_node=2 --nnodes=2 \
                  --rdzv_backend=c10d \
                  --rdzv_endpoint=$MASTER_ADDR:$MASTER_PORT \
                  --rdzv_id=jobset-gpu \
                  --node_rank=$RANK \
                  train.py --epochs=10 --batch-size=128 --lr=0.1