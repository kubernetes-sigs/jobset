apiVersion: config.jobset.x-k8s.io/v1alpha1
kind: Configuration
leaderElection:
  leaderElect: true
internalCertManagement:
  enable: true
featureGates:
  JobSetWorkloadAwareSchedulingAPI: true
  # JobSetGangOfGangs is off here so the flat (default) scheduling path is
  # tested; the gang-of-gangs specs run against ../scheduling-gang-of-gangs.
  JobSetGangOfGangs: false
  ElasticJobSet: true
