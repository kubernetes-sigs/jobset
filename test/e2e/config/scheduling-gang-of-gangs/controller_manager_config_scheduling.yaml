apiVersion: config.jobset.x-k8s.io/v1alpha1
kind: Configuration
leaderElection:
  leaderElect: true
internalCertManagement:
  enable: true
featureGates:
  JobSetWorkloadAwareSchedulingAPI: true
  # With JobSetGangOfGangs on, every JobSet with spec.scheduling compiles to the
  # CompositePodGroup tree. Only the specs labeled gang-of-gangs run against
  # this deployment.
  JobSetGangOfGangs: true
  ElasticJobSet: true
