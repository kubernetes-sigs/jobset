kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
featureGates:
  GenericWorkload: true
  # TopologyAwareWorkloadScheduling and DRAWorkloadResourceClaims must be
  # enabled to exercise spec.scheduling.schedulingConstraints.topology and
  # spec.scheduling.replicatedJobs[].resourceClaims. Without these,
  # the apiserver silently drops the corresponding PodGroup fields on write
  # (see pkg/registry/scheduling/podgroup dropDisabledPodGroupFields), which
  # then looks like permanent spec drift to the JobSet controller and causes
  # it to continuously delete and recreate the Workload/PodGroup.
  TopologyAwareWorkloadScheduling: true
  DRAWorkloadResourceClaims: true
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: ClusterConfiguration
        apiVersion: kubeadm.k8s.io/v1beta4
        scheduler:
          extraArgs:
          - name: v
            value: "3"
        controllerManager:
          extraArgs:
          - name: v
            value: "3"
        apiServer:
          extraArgs:
          - name: enable-aggregator-routing
            value: "true"
          - name: runtime-config
            # enable WAS apis such as workloads/podgroups. JobSet's controller
            # creates Workload/PodGroup objects via the v1beta1 client, so
            # v1beta1 storage must be enabled. v1alpha3 may additionally be
            # necessary once CompositePodGroup support is added.
            value: "scheduling.k8s.io/v1beta1=true"
          - name: v
            value: "3"
      - |
        kind: InitConfiguration
        apiVersion: kubeadm.k8s.io/v1beta4
        nodeRegistration:
          kubeletExtraArgs:
          - name: v
            value: "3"
  - role: worker
    labels:
      instance-type: on-demand
  - role: worker
    labels:
      instance-type: spot

kubeadmConfigPatches:
  - |
    kind: JoinConfiguration
    apiVersion: kubeadm.k8s.io/v1beta4
    nodeRegistration:
      kubeletExtraArgs:
      - name: v
        value: "3"
